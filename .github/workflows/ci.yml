name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      # Actions are pinned to full commit SHAs (not mutable tags) to prevent
      # supply-chain tampering with the CI toolchain itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      # Hard gate on runtime dependencies — the shipped attack surface.
      # Full-tree audit note: the only remaining high advisory (braces
      # GHSA-vfj7-8cjw-p6xm) is dev-only (eslint-config-next -> fast-glob ->
      # micromatch -> braces), has NO patched release, and the "fix" npm
      # suggests is a downgrade to eslint-config-next@14. Non-blocking until
      # upstream ships a patch; see SECURITY.md.
      - name: Audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit (full tree, informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
